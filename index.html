<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Erick Quest">

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Erick Quest · 6º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--line:#ffffff26;--mut:#c9bfff;--pink:#ff3d9a;--cyan:#19e3ff;--yel:#ffd43b;--grn:#38f27c;--org:#ff8a3d;--pur:#9b5cff;--sa:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;font-size:16px;color:#fff;min-height:100vh;min-height:100dvh;
background:radial-gradient(circle at 15% 0,#5b1fa8 0,transparent 45%),radial-gradient(circle at 100% 35%,#0a6a9c 0,transparent 40%),radial-gradient(circle at 40% 100%,#a3157a 0,transparent 45%),linear-gradient(160deg,#140a33,#2d0f5e);
background-attachment:fixed;overscroll-behavior-y:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco i{position:absolute;opacity:.16;animation:fl 14s ease-in-out infinite}
.deco i:nth-child(1){left:4%;top:20%;width:54px;height:54px;border-radius:50%;background:var(--pink)}
.deco i:nth-child(2){left:84%;top:14%;width:44px;height:44px;background:var(--cyan);border-radius:10px;animation-delay:-3s}
.deco i:nth-child(3){left:76%;top:70%;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:52px solid var(--yel);animation-delay:-6s}
.deco i:nth-child(4){left:8%;top:74%;width:40px;height:40px;border-radius:50%;border:7px solid var(--grn);animation-delay:-9s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-36px) rotate(25deg)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 14px calc(92px + var(--sa))}
body.playing #app{padding-bottom:24px}
button{font-family:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + var(--st)) 0 10px;background:linear-gradient(#160b36 70%,#160b3600)}
.logo{font-size:22px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--yel),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:5px;align-items:center}
.pill{background:#ffffff1c;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-weight:800;font-size:13px;white-space:nowrap}
.ghost{background:#ffffff1c;border:1px solid var(--line);border-radius:12px;min-width:40px;height:36px;font-size:17px;font-weight:800}
.btn{border:0;border-radius:16px;min-height:50px;padding:10px 20px;font-size:18px;font-weight:800;color:#2a0a4a;background:linear-gradient(180deg,#ffe66d,#ffb703);box-shadow:0 5px 0 #b57a00;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57a00}
.btn.full{width:100%}
.btn.pink{color:#fff;background:linear-gradient(180deg,#ff6fb8,#e0157f);box-shadow:0 5px 0 #8f0b52}
.btn.pink:active{box-shadow:0 1px 0 #8f0b52}
.btn.cyan{color:#02334a;background:linear-gradient(180deg,#7df0ff,#12b9de);box-shadow:0 5px 0 #0a6b84}
.card{background:#ffffff14;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:19px}
.herocard{text-align:center;padding-top:6px}
.herocard svg{width:min(62vw,240px);height:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 14px #0008)}
@keyframes bob{50%{transform:translateY(-7px)}}
.hname{font-size:34px;font-weight:800;line-height:1;color:var(--yel);text-shadow:0 3px 0 #b57a00}
.htitle{color:var(--cyan);font-weight:800;font-size:18px;margin:2px 0 8px}
.bubble{background:#fff;color:#2a0a4a;border-radius:16px;padding:8px 12px;font-weight:700;font-size:14px;margin:0 0 10px;position:relative;text-align:left}
.bubble:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.xpbar,.bar{height:16px;background:#0006;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar{height:12px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--yel));transition:width .7s cubic-bezier(.2,1.4,.4,1)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,#38f27c);box-shadow:0 0 10px var(--c,#38f27c);transition:width .6s}
.lbl{font-size:13px;color:var(--mut);margin-top:5px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#ffffff14;border:1px solid var(--line);border-radius:18px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat small{color:var(--mut);font-size:12px}
.gears{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{background:#0004;border:2px solid transparent;border-radius:16px;padding:8px 4px;text-align:center;filter:grayscale(1);opacity:.65}
.gi span{font-size:26px;display:block}
.gi b{display:block;font-size:12px;line-height:1.1}
.gi small{font-size:11px;color:var(--mut)}
.gi.on{filter:none;opacity:1;border-color:var(--c);box-shadow:0 0 14px -2px var(--c);background:#ffffff1f}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff5;padding:0}
.sw.sel{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 3px #0006}
.sec{font-size:21px;font-weight:800;margin:6px 0 8px}
.mis{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(160deg,#ffffff1f,#ffffff0a);border:2px solid var(--c);border-radius:20px;padding:10px 12px;margin-bottom:10px;box-shadow:0 0 18px -6px var(--c);min-height:76px}
.mis:active{transform:scale(.98)}
.axi{flex:none;font-size:30px;background:#0004;border-radius:16px;width:52px;height:52px;display:grid;place-items:center}
.mi{flex:1;min-width:0}
.mi b{display:block;font-size:19px;line-height:1.1}
.mi .t{display:block;color:var(--mut);font-size:13px;line-height:1.1;margin-bottom:5px}
.mi small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.lv{flex:none;background:var(--c);color:#1b0a33;font-weight:800;border-radius:10px;padding:2px 9px;font-size:14px}
.mega{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:22px;padding:16px;margin-bottom:12px;min-height:84px;font-size:20px;font-weight:800}
.mega small{display:block;font-weight:700;font-size:14px;opacity:.9}
.mega .big{font-size:38px}
.mega.pink{background:linear-gradient(180deg,#ff6fb8,#e0157f);box-shadow:0 6px 0 #8f0b52}
.mega.cyan{background:linear-gradient(180deg,#5fe9ff,#0e9fc4);color:#02334a;box-shadow:0 6px 0 #0a6b84}
.mega:active{transform:translateY(5px);box-shadow:none}
.dom{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.dom span:first-child{width:118px;flex:none;font-weight:700}
.dom .bar{flex:1}
.dom b{width:40px;text-align:right}
details.gr{border:2px solid var(--c);border-radius:18px;background:#ffffff10;margin-bottom:10px;padding:0 12px}
details.gr summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:56px;font-weight:800;font-size:18px}
details.gr summary::-webkit-details-marker{display:none}
details.gr summary small{margin-left:auto;color:var(--mut);font-size:13px}
details.gr ul{margin:0 0 8px;padding-left:20px;color:#efe9ff;font-size:15px}
.kws{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
.kw{border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700}
.kw.on{background:var(--c);color:#1b0a33}
.kw.off{background:#0005;color:#aaa}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:var(--sa);background:#140a33f7;border-top:1px solid var(--line)}
.tabs .in{display:flex;max-width:520px;margin:0 auto}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:7px 0 6px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:0;min-height:60px}
.tabs button span{font-size:25px;transition:.2s}
.tabs button.on{color:#fff}
.tabs button.on span{transform:translateY(-3px) scale(1.2)}
/* questão */
.qtop{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:calc(10px + var(--st)) 0 10px;background:linear-gradient(#160b36 75%,#160b3600)}
.pbar{flex:1;height:18px;background:#0006;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--grn));border-radius:99px;transition:width .4s}
.combo{font-weight:800;font-size:17px;background:#0005;padding:3px 10px;border-radius:99px;min-width:62px;text-align:center}
.combo.hot{background:linear-gradient(90deg,#ff4d00,#ffb703);animation:pop .4s;box-shadow:0 0 16px #ff8a3d}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chip{display:inline-block;background:var(--c);color:#1b0a33;font-weight:800;border-radius:99px;padding:3px 12px;font-size:13px}
.pw{background:linear-gradient(180deg,#b388ff,#7c4dff);border:0;border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #4527a0}
.pw:disabled{opacity:.4}
.qcard{background:linear-gradient(160deg,#ffffff22,#ffffff0a);border:2px solid var(--c);border-radius:24px;padding:14px;box-shadow:0 0 26px -6px var(--c);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.qn{font-size:13px;color:var(--mut);font-weight:700}
.qcard h2{font-size:22px;line-height:1.2;margin:4px 0 14px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border-radius:16px;padding:8px 12px;min-height:56px;font-size:18px;font-weight:700;line-height:1.15;background:#ffffff1c;border:2px solid var(--line);transition:transform .1s}
.opt:active:not(:disabled){transform:scale(.97)}
.opt b{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#1b0a33}
.o0 b{background:var(--yel)}.o1 b{background:var(--cyan)}.o2 b{background:var(--pink)}.o3 b{background:var(--grn)}
.opt.right{background:linear-gradient(90deg,#16a34a,#38f27c88);border-color:#38f27c;animation:pop .5s;box-shadow:0 0 20px #38f27c88}
.opt.wrong{background:#dc262688;border-color:#ff5d5d;animation:shake .4s}
.opt.dim{opacity:.45}
.opt.gone{opacity:.22;text-decoration:line-through;pointer-events:none}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:12px 16px calc(12px + var(--sa));animation:up .3s cubic-bezier(.2,1.2,.4,1);box-shadow:0 -10px 40px #000a}
@keyframes up{from{transform:translateY(100%)}}
.sheet.good{background:linear-gradient(#0f6a3a,#0a3d27);border-top:3px solid #38f27c}
.sheet.bad{background:linear-gradient(#8a2020,#4a1010);border-top:3px solid #ff5d5d}
.fbh{font-weight:800;font-size:21px;line-height:1.1}
.key{display:inline-block;margin:6px 0 2px;background:linear-gradient(90deg,var(--yel),var(--org));color:#2b1300;font-weight:800;border-radius:12px;padding:3px 12px;font-size:15px}
.sheet p{margin:4px 0 10px;font-size:15px;line-height:1.25;color:#f4efff}
/* resultado */
.res{text-align:center;padding-top:calc(20px + var(--st))}
.res h2{font-size:30px;margin:0}
.stars{font-size:58px;letter-spacing:4px;margin:4px 0}
.stars span{display:inline-block;animation:pop .6s backwards}
.nota{font-size:78px;font-weight:800;line-height:1;color:var(--yel);text-shadow:0 5px 0 #b57a00}
.rows{text-align:left;margin:12px 0}
.chest{width:100%;border:3px dashed var(--yel);background:#ffd43b22;border-radius:22px;padding:14px;font-size:20px;font-weight:800;margin:10px 0;animation:bob 1.4s infinite}
.chest span{font-size:46px;display:block}
.stack{display:grid;gap:12px;margin-top:14px}
/* fx */
.cf{position:fixed;width:10px;height:10px;border-radius:3px;z-index:99;pointer-events:none;animation:cf 1.1s ease-out forwards}
@keyframes cf{40%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--dx),calc(var(--dy) + 340px)) rotate(var(--r));opacity:0}}
.ft{position:fixed;z-index:99;font-weight:800;font-size:26px;pointer-events:none;animation:ft 1s ease-out forwards;text-shadow:0 2px 0 #0008;transform:translateX(-50%)}
@keyframes ft{to{transform:translate(-50%,-70px) scale(1.3);opacity:0}}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;animation:fl2 .45s ease-out forwards}
@keyframes fl2{from{opacity:.35}to{opacity:0}}
#toasts{position:fixed;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{background:linear-gradient(90deg,#7c3aed,#ec4899);border:2px solid #fff6;border-radius:16px;padding:9px 14px;font-weight:800;text-align:center;box-shadow:0 8px 24px #0008;animation:in .35s}
.modal{position:fixed;inset:0;background:#000b;z-index:110;display:grid;place-items:center;padding:20px}
.mbox{background:linear-gradient(160deg,#4c1d95,#be185d);border:3px solid var(--yel);border-radius:28px;padding:20px;text-align:center;width:100%;max-width:380px;animation:pop .5s;box-shadow:0 0 60px #ffd43b88}
.mbox h2{font-size:38px;margin:0;color:var(--yel)}
.mbox svg{width:150px;animation:bob 1.6s infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="deco"><i></i><i></i><i></i><i></i></div>
<div id="toasts"></div>
<div id="app"></div>

<script>
/* ============ DADOS ============ */
const EIXOS={
forca:{nome:"Força",icone:"💪",cor:"#ff4d6d",tema:"Substantivos",mat:"pt",gear:"Espada",gi:"⚔️",
 resumo:["Substantivo dá nome a seres, objetos, sentimentos, lugares e fenômenos.","Comum x Próprio (maiúscula) · Concreto x Abstrato · Simples x Composto · Primitivo x Derivado.","Coletivo = nome de um conjunto (enxame, cardume, matilha, manada)."]},
agilidade:{nome:"Agilidade",icone:"⚡",cor:"#ffd43b",tema:"Verbos",mat:"pt",gear:"Botas Raio",gi:"🥾",
 resumo:["Verbo indica ação (correr), estado (estar) ou fenômeno da natureza (chover).","Tempos: presente (agora), pretérito/passado (antes) e futuro (depois)."]},
inteligencia:{nome:"Inteligência",icone:"🧠",cor:"#9b5cff",tema:"Artigo, Adjetivo, Pronome",mat:"pt",gear:"Óculos Gênio",gi:"🕶️",
 resumo:["Artigo acompanha o substantivo: definidos (o, a, os, as) e indefinidos (um, uma, uns, umas).","Adjetivo caracteriza o substantivo (menino inteligente).","Pronome substitui ou acompanha um substantivo (eu, você, ele, meu, aquele)."]},
carisma:{nome:"Carisma",icone:"🗣️",cor:"#ff8ad8",tema:"Linguagem e Comunicação",mat:"pt",gear:"Capa",gi:"🦸",
 resumo:["Linguagem: qualquer forma de comunicação. Língua: sistema de uma comunidade. Fala: jeito individual de usar a língua.","Verbal (palavras) · Não verbal (imagens, gestos, símbolos) · Mista (os dois).","Variação linguística: região, idade, grupo social, situação. Preconceito linguístico é discriminar o jeito de falar."]},
criatividade:{nome:"Criatividade",icone:"🎨",cor:"#ff8a3d",tema:"Textos e Gêneros",mat:"pt",gear:"Paleta",gi:"🎨",
 resumo:["Tipos: narração (conta), descrição (características), exposição (explica), argumentação (opinião), injunção (instruções).","Narração: narrador, personagens, tempo, espaço, enredo.","Conto (fantasia, humor, mistério, terror) · Lenda (real + imaginário) · Fábula (animais + moral).","Jornalísticos: notícia, reportagem, entrevista. Relatório registra observações e resultados."]},
coragem:{nome:"Coragem",icone:"🛡️",cor:"#19e3ff",tema:"Greetings & Pronouns",mat:"en",gear:"Escudo",gi:"🛡️",
 resumo:["Hello · Good morning/afternoon/evening · Goodbye.","What's your name? / My name is... · How are you?","Pronouns: I, You, He, She, It (coisas e animais), We, They."]},
magia:{nome:"Magia",icone:"✨",cor:"#c77dff",tema:"Verb To Be",mat:"en",gear:"Chapéu Mágico",gi:"🎩",
 resumo:["To be = ser ou estar.","I am · You are · He/She/It is · We are · They are.","I am a student. She is happy. They are friends."]},
sorte:{nome:"Sorte",icone:"🍀",cor:"#38f27c",tema:"Vocabulary",mat:"en",gear:"Trevo",gi:"🍀",
 resumo:["Numbers: one, two, three... ten, twenty, thirty, one hundred.","Colors: red, blue, green, yellow, black, white, pink, purple, orange, brown.","Family: mother, father, sister, brother, grandmother, grandfather, parents.","Days: Monday to Sunday · School: book, notebook, pencil, pen, eraser, ruler, backpack, desk."]},
precisao:{nome:"Precisão",icone:"🎯",cor:"#4dabf7",tema:"Articles & Demonstratives",mat:"en",gear:"Alvo",gi:"🎯",
 resumo:["A (som de consoante) · An (som de vogal) · The (o, a, os, as).","This (perto, singular) · That (longe, singular) · These (perto, plural) · Those (longe, plural)."]}
};
/* [eixo, pergunta, correta, "errada1|errada2|errada3" (ou só 1 errada p/ verdadeiro-falso), palavra-chave, explicação] */
const RAW=[
/* ---- FORÇA: substantivos ---- */
["forca","Qual destas palavras é um substantivo PRÓPRIO?","Brasil","país|cidade|rio","Próprio = nome específico + maiúscula","Substantivo próprio nomeia um ser em particular e começa com maiúscula. País, cidade e rio são nomes gerais (comuns)."],
["forca","“Felicidade” é um substantivo...","abstrato","concreto|coletivo|próprio","Abstrato = sentimento, ideia, qualidade","Abstratos nomeiam sentimentos, ideias e qualidades. Felicidade é um sentimento."],
["forca","Qual destes é um substantivo CONCRETO?","mesa","saudade|alegria|coragem","Concreto = existe por si só","Mesa é um objeto que existe por si só. Saudade, alegria e coragem são sentimentos (abstratos)."],
["forca","Qual palavra é um substantivo COMPOSTO?","guarda-chuva","pedreiro|jardim|folhagem","Composto = duas palavras juntas","Guarda-chuva junta guarda + chuva, então é composto."],
["forca","Qual palavra é um substantivo SIMPLES?","flor","girassol|beija-flor|passatempo","Simples = um só radical","Flor tem um só radical. Girassol (gira+sol), beija-flor e passatempo têm dois."],
["forca","Qual substantivo é PRIMITIVO?","pedra","pedreiro|pedregulho|pedrada","Primitivo = não vem de outra palavra","Pedra é a palavra original. Pedreiro, pedregulho e pedrada nasceram dela (derivados)."],
["forca","“Livraria” (vem de “livro”) é um substantivo...","derivado","primitivo|composto|coletivo","Derivado = nasce de uma palavra primitiva","Livraria vem de livro + -aria, por isso é derivado."],
["forca","Qual é o coletivo de abelhas?","enxame","cardume|matilha|manada","Coletivo = nome de um conjunto","Enxame é o conjunto de abelhas. Cardume = peixes, matilha = cães/lobos, manada = bois."],
["forca","Matilha é o coletivo de...","cães ou lobos","peixes|abelhas|ovelhas","Matilha = cães/lobos","Peixes formam cardume; ovelhas formam rebanho."],
["forca","Qual alternativa tem SÓ substantivos?","menino, escola, alegria","correr, pular, nadar|bonito, alto, forte|eu, tu, ele","Substantivo = nome","Menino (ser), escola (lugar) e alegria (sentimento) são substantivos."],
["forca","Em “Maria mora em Salvador”, quais são os substantivos próprios?","Maria e Salvador","mora e Salvador|Maria e mora|apenas mora","Próprio = pessoas e lugares específicos","Maria (pessoa) e Salvador (cidade) nomeiam seres específicos. Mora é verbo."],
["forca","Qual destas palavras é um substantivo COLETIVO?","manada","boi|pasto|leite","Coletivo = singular que indica vários","Manada indica vários bois juntos."],
["forca","O que é um substantivo?","A palavra que dá nome aos seres e às coisas","A palavra que indica uma ação ou estado|A palavra que caracteriza um nome|A palavra que acompanha o verbo","Substantivo = NOME","Substantivo dá nome a seres, objetos, sentimentos, lugares e fenômenos."],
["forca","Cardume é o conjunto de...","peixes","lobos|aves|bois","Cardume = peixes","Cardume é o coletivo de peixes."],
["forca","“Substantivos próprios começam sempre com letra maiúscula.”","Verdadeiro","Falso","Próprio = inicial maiúscula","Nomes de pessoas, lugares e países (Erick, Bahia, Brasil) sempre começam com maiúscula."],
["forca","Qual destes é um substantivo ABSTRATO?","saudade","cachorro","Abstrato = sentimento","Saudade é um sentimento, não dá pra tocar."],
["forca","“Coragem” é um substantivo concreto.","Falso","Verdadeiro","Coragem = abstrato","Coragem é uma qualidade/sentimento, então é abstrato."],

/* ---- AGILIDADE: verbos ---- */
["agilidade","Qual palavra indica AÇÃO?","correr","bonito|casa|azul","Verbo de ação = faz algo","Correr é uma ação. Bonito e azul são adjetivos; casa é substantivo."],
["agilidade","Qual verbo indica FENÔMENO DA NATUREZA?","chover","correr|estar|cantar","Fenômeno da natureza = chover, ventar","Chover é um fenômeno da natureza. Correr e cantar são ações; estar indica estado."],
["agilidade","Qual verbo indica ESTADO?","estar","pular|nadar|chover","Verbo de estado = ser, estar, ficar","Estar mostra como alguém ou algo está."],
["agilidade","Em “Ontem eu estudei muito”, o verbo está no...","pretérito (passado)","presente|futuro|infinitivo","Ontem = pretérito","Ontem indica algo que já aconteceu."],
["agilidade","“Amanhã viajaremos para a praia”. Qual é o tempo verbal?","futuro","presente|passado|nenhum","Amanhã = futuro","Amanhã indica algo que ainda vai acontecer."],
["agilidade","“Eu estudo agora”. Qual é o tempo verbal?","presente","futuro|passado|nenhum","Agora = presente","Agora indica o momento atual."],
["agilidade","Qual é o verbo de “Maria canta lindamente”?","canta","Maria|lindamente|Maria canta","Verbo = ação (o que faz?)","A ação é cantar. Maria é substantivo."],
["agilidade","Qual frase tem verbo no PASSADO?","Eles comeram pizza.","Eles comem pizza.|Eles comerão pizza.|Pizza deliciosa.","Comeram = passado","Comem é presente e comerão é futuro."],
["agilidade","Qual frase tem verbo no FUTURO?","Eu viajarei amanhã.","Eu viajei ontem.|Eu viajo hoje.|Viagem longa.","Viajarei = futuro","Viajarei indica algo que ainda vai acontecer."],
["agilidade","Em “Ventou muito ontem”, o verbo indica...","fenômeno da natureza","ação de uma pessoa|estado de espírito|característica","Ventar = fenômeno da natureza","Ventou não depende de uma pessoa: é da natureza."],
["agilidade","Verbos indicam...","ação, estado ou fenômeno da natureza","nome de seres e lugares|qualidade dos substantivos|apenas quantidades","Verbo = ação, estado, fenômeno","Verbo expressa o que acontece ou como algo está."],
["agilidade","Qual palavra NÃO é verbo?","cantora","cantar|canta|cantou","Cantora = substantivo","Cantora é quem canta (substantivo)."],
["agilidade","Em “O céu está nublado”, o verbo “está” indica...","estado","ação|fenômeno da natureza|nome","Estar = estado","Está mostra como o céu está."],
["agilidade","“Chover” é um verbo que indica fenômeno da natureza.","Verdadeiro","Falso","Chover = fenômeno","Chover, ventar e trovejar são fenômenos da natureza."],
["agilidade","Qual frase tem verbo no PRESENTE?","Eu leio um livro agora.","Eu li um livro ontem.|Eu lerei um livro amanhã.|Livro interessante.","Leio = presente","Leio é a ação acontecendo agora."],
["agilidade","Em “Os alunos fizeram a prova”, qual é o verbo?","fizeram","alunos|prova|Os","Verbo = fizeram","Fizeram é a ação. Alunos e prova são substantivos."],
["agilidade","Em “Ele ficou triste”, o verbo “ficou” indica...","estado","ação|fenômeno da natureza|característica","Ficar = estado","Ficou mostra o estado em que ele ficou."],
["agilidade","Qual destes verbos NÃO indica ação?","estar","correr|escrever|pular","Estar = estado","Correr, escrever e pular são ações. Estar é estado."],
["agilidade","Em “Nós cantamos ontem”, o tempo do verbo é...","pretérito (passado)","presente|futuro|nenhum","Ontem = passado","Ontem mostra que a ação já aconteceu."],
["agilidade","Verbo no tempo que fala de algo que ainda VAI acontecer:","futuro","presente|pretérito|nenhum","Futuro = vai acontecer","O futuro indica ações que ainda vão acontecer."],
/* ---- INTELIGÊNCIA: artigo, adjetivo, pronome ---- */
["inteligencia","Qual é um artigo DEFINIDO?","os","um|uma|uns","Definidos: o, a, os, as","Os é definido. Um, uma e uns são indefinidos."],
["inteligencia","Qual conjunto tem só artigos INDEFINIDOS?","um, uma, uns, umas","o, a, os, as|eu, tu, ele|meu, teu, seu","Indefinidos: um, uma, uns, umas","O, a, os, as são definidos."],
["inteligencia","Em “Comprei um livro”, a palavra “um” é artigo...","indefinido","definido|adjetivo|verbo","Um/uma = indefinido","Fala de um livro qualquer, não específico."],
["inteligencia","Em “O menino inteligente”, qual é o adjetivo?","inteligente","O|menino|não há","Adjetivo = característica","Inteligente caracteriza o menino."],
["inteligencia","O adjetivo serve para...","caracterizar o substantivo","indicar ação|substituir o verbo|ligar frases","Adjetivo caracteriza","Dá qualidades ao substantivo (alto, alegre, bonito)."],
["inteligencia","Qual palavra é um adjetivo?","alegre","alegria|alegrar|casa","Adjetivo = qualidade","Alegria é substantivo e alegrar é verbo."],
["inteligencia","Qual é um pronome pessoal?","eu","casa|correr|bonito","Pronome pessoal: eu, você, ele...","Casa é substantivo, correr é verbo e bonito é adjetivo."],
["inteligencia","Em “Ela chegou cedo”, a palavra “ela” substitui...","um substantivo (uma pessoa)","um verbo|um adjetivo|um artigo","Pronome = substitui o substantivo","Ela está no lugar do nome de uma pessoa."],
["inteligencia","Qual grupo tem artigo + substantivo + adjetivo, nessa ordem?","o gato preto","correu muito rápido|eu e ela|brincou ontem","Artigo + substantivo + adjetivo","O (artigo), gato (substantivo), preto (adjetivo)."],
["inteligencia","Pronome é a palavra que...","substitui ou acompanha um substantivo","dá nome aos seres|indica ação|só caracteriza verbos","Pronome = substitui ou acompanha","Aparece no lugar do substantivo ou junto dele (meu caderno)."],
["inteligencia","Complete: ___ meninas chegaram. (artigo definido, feminino plural)","As","Os|Uma|Uns","As = definido feminino plural","As meninas: artigo definido, feminino, plural."],
["inteligencia","Em “casa grande”, qual palavra caracteriza o substantivo?","grande","casa|um|o","Adjetivo vem junto do substantivo","Grande dá característica à casa."],
["inteligencia","Qual destes é um pronome?","aquele","menino|correr|belo","Aquele, meu, eu = pronomes","Aquele aponta ou acompanha um substantivo."],
["inteligencia","“O adjetivo caracteriza o substantivo.”","Verdadeiro","Falso","Adjetivo = característica","Exatamente: mostra como o substantivo é."],
["inteligencia","Em “uma casa antiga”, qual é o artigo?","uma","casa|antiga|nenhum","Uma = artigo indefinido","Uma acompanha o substantivo casa."],
["inteligencia","Qual frase tem pronome pessoal?","Ele chegou cedo.","A casa é grande.|Os livros caíram.|Correr faz bem.","Ele = pronome pessoal","Ele substitui o nome de alguém."],
["inteligencia","Em “Ela comprou um livro novo”, qual é o adjetivo?","novo","livro|comprou|um","Novo caracteriza livro","Novo diz como é o livro."],
["inteligencia","Qual é o artigo definido masculino singular?","o","a|um|os","O = definido, masc., singular","O acompanha substantivos masculinos no singular."],
["inteligencia","Em “Meu caderno é azul”, a palavra “meu” é...","pronome","verbo|artigo|substantivo","Meu = pronome (posse)","Meu acompanha o substantivo e indica de quem é."],
["inteligencia","“Bonito” é uma palavra que...","caracteriza (adjetivo)","indica ação (verbo)|dá nome (substantivo)|substitui nomes (pronome)","Bonito = adjetivo","Bonito dá característica."],
/* ---- CARISMA: linguagem e comunicação ---- */
["carisma","Linguagem é...","toda forma de comunicar: palavras, gestos, imagens","apenas a comunicação escrita em livros","somente a fala usada entre as pessoas","o idioma oficial de um único país","Linguagem = toda forma de comunicar","Inclui palavras, gestos, imagens e sons."],
["carisma","Língua é...","o sistema de comunicação de uma comunidade","o jeito de falar de uma pessoa só","toda comunicação feita por gestos","qualquer imagem que tenha texto","Língua = sistema da comunidade","O português é uma língua: todos da comunidade compartilham."],
["carisma","Fala é...","o jeito individual de cada pessoa usar a língua","o idioma de uma comunidade inteira","toda comunicação feita por desenhos","o texto escrito de um livro","Fala = jeito individual","Cada pessoa tem seu jeito de falar."],
["carisma","Uma placa de trânsito só com desenho é linguagem...","não verbal","verbal|mista|escrita","Não verbal = sem palavras","Se usa só imagem, é não verbal."],
["carisma","Uma tirinha com desenhos e balões de fala é linguagem...","mista","somente verbal|somente não verbal|inexistente","Mista = palavras + imagens","Mistura palavras e imagens."],
["carisma","Linguagem VERBAL é a que usa...","palavras","só imagens|só gestos|só cores","Verbal = palavras","Verbal usa palavras, faladas ou escritas."],
["carisma","O que é variação linguística?","a mudança no jeito de falar conforme região, idade e grupo","um erro de português cometido ao falar","uma língua que foi inventada recentemente","um tipo de texto jornalístico","Variação = muda conforme região, idade, grupo","A língua muda de acordo com quem fala e onde fala. Não é erro."],
["carisma","Mandioca, aipim e macaxeira mostram variação...","regional","só de idade|só de escrita|de gestos","Variação regional = lugar","Os nomes mudam de região para região."],
["carisma","Rir ou desprezar alguém pelo jeito de falar é...","preconceito linguístico","variação linguística|linguagem mista|gênero textual","Preconceito linguístico","Discriminar alguém pela forma de falar ou escrever."],
["carisma","Gírias de grupos de jovens mostram variação por...","idade e grupo social","só a região|só o tempo verbal|erro","Variação por idade e grupo","Jovens de um grupo criam expressões próprias."],
["carisma","Gestos, expressões e símbolos formam a linguagem...","não verbal","verbal|escrita|oral","Não verbal = gestos, símbolos","Não usam palavras."],
["carisma","Português, inglês e espanhol são exemplos de...","línguas","falas|gêneros textuais|tempos verbais","Língua = idioma","São sistemas de comunicação de comunidades diferentes."],
["carisma","“Falar diferente da escrita formal é sempre errado.”","Falso","Verdadeiro","Variação ≠ erro","Existem variações da língua, todas legítimas em seu contexto."],
["carisma","Um emoji sozinho, sem nenhuma palavra, é linguagem não verbal.","Verdadeiro","Falso","Imagem = não verbal","Sem palavras, só imagem: não verbal."],
["carisma","Uma propaganda com foto e frase escrita usa linguagem...","mista","apenas verbal|apenas não verbal|nenhuma","Foto + texto = mista","Mistura imagem e palavras."],
["carisma","Debochar do sotaque de alguém é praticar...","preconceito linguístico","variação regional|linguagem mista|fala individual","Sotaque merece respeito","É discriminar a pessoa pelo jeito de falar."],
/* ---- CRIATIVIDADE: textos ---- */
["criatividade","Qual tipo textual CONTA acontecimentos?","narração","descrição|injunção|argumentação","Narração = conta fatos","Narrar é contar uma sequência de fatos."],
["criatividade","Qual tipo textual apresenta CARACTERÍSTICAS de pessoas, lugares ou objetos?","descrição","narração|injunção|exposição","Descrição = características","Descrever é mostrar como algo ou alguém é."],
["criatividade","Qual tipo textual EXPLICA informações?","exposição","narração|descrição|injunção","Exposição = explica","Texto expositivo explica e informa."],
["criatividade","Qual tipo textual DEFENDE uma opinião?","argumentação","narração|exposição|descrição","Argumentação = opinião + argumentos","Quem argumenta defende um ponto de vista."],
["criatividade","Qual tipo textual dá INSTRUÇÕES (como uma receita)?","injunção","narração|descrição|argumentação","Injunção = instruções","Receitas e manuais orientam o leitor."],
["criatividade","Qual NÃO é elemento da narração?","rima","narrador|personagens|enredo","Narração: narrador, personagens, tempo, espaço, enredo","Rima é característica de poemas."],
["criatividade","Enredo é...","a sequência de acontecimentos da história","o nome de quem escreveu o texto","o lugar onde a história acontece","a opinião de quem lê","Enredo = sequência de fatos","É a trama: o que acontece do começo ao fim."],
["criatividade","Qual narrativa geralmente tem animais e termina com uma moral?","fábula","lenda|notícia|relatório","Fábula = animais + moral","A fábula ensina uma lição (moral)."],
["criatividade","Lenda é uma narrativa popular que mistura...","fatos reais e elementos imaginários","apenas fatos comprovados","somente opiniões do autor","só instruções de uso","Lenda = real + imaginário","Lendas como a do Curupira misturam realidade e fantasia."],
["criatividade","Qual gênero é jornalístico?","notícia","conto de fadas|poema|bilhete","Jornalísticos: notícia, reportagem, entrevista","Notícia informa sobre acontecimentos reais."],
["criatividade","Qual gênero jornalístico é uma conversa com perguntas e respostas?","entrevista","fábula|receita|carta","Entrevista = perguntas e respostas","Traz perguntas feitas a alguém e as respostas."],
["criatividade","Texto que registra informações, observações e resultados de uma pesquisa é...","relatório","lenda|fábula|bilhete","Relatório = registra resultados","Documenta o que foi observado ou descoberto."],
["criatividade","Conto com enigmas, pistas e investigação é conto de...","mistério","humor|fantasia|terror","Mistério = enigmas e pistas","Detetives e segredos são típicos do mistério."],
["criatividade","Conto que busca causar medo no leitor é de...","terror","humor|mistério|fantasia","Terror = medo","O objetivo do terror é assustar."],
["criatividade","Bilhete, carta e receita são exemplos de...","gêneros textuais","elementos da narração|classes de palavras|tempos verbais","Gênero textual = forma + finalidade","Cada um tem finalidade e organização próprias."],
["criatividade","Conto é...","uma narrativa curta, com personagens e conflito","um texto de instruções passo a passo","uma lista de palavras soltas","uma entrevista com perguntas","Conto = narrativa curta","É uma história geralmente curta com conflito."],
["criatividade","Qual elemento da narração indica QUEM conta a história?","narrador","enredo|espaço|tempo","Narrador = quem conta","O narrador conta a história ao leitor."],
["criatividade","“Em uma floresta escura” indica qual elemento da narração?","espaço","tempo|narrador|personagem","Espaço = onde","Espaço é o lugar onde a história acontece."],
["criatividade","Reportagem pertence aos gêneros...","jornalísticos","fantásticos|instrucionais|poéticos","Jornalísticos informam","Reportagem aprofunda informações sobre fatos reais."],
["criatividade","“A fábula geralmente apresenta uma moral.”","Verdadeiro","Falso","Fábula = moral","A moral é o ensinamento final."],
["criatividade","Conto cujo objetivo é fazer o leitor rir é conto de...","humor","terror|mistério|fantasia","Humor = riso","O humor busca divertir."],
["criatividade","Fadas, dragões e magia aparecem no conto de...","fantasia","humor|mistério|terror","Fantasia = magia","Contos de fantasia têm elementos mágicos."],
["criatividade","Um texto defendendo que o celular deve ser liberado na escola é...","argumentação","narração|descrição|injunção","Argumentação = defende opinião","Quem defende um ponto de vista argumenta."],

["coragem","“They” significa...","eles/elas","ele|nós|eu","They = eles/elas","They é para mais de uma pessoa ou coisa."],
["coragem","Qual pronome usamos para coisas e animais?","It","He|She|We","It = coisas e animais","It substitui objetos e animais."],
["coragem","“You” significa...","você","eu|ela|nós","You = você","You é você (ou vocês)."],
["coragem","“Hello” significa...","olá","tchau|boa noite|obrigado","Hello = olá","O cumprimento mais comum."],

["coragem","Como se diz “Meu nome é Ana.”?","My name is Ana.","Your name is Ana.|How are you, Ana?|Goodbye, Ana.","My name is...","Para dizer seu nome, use My name is."],

["coragem","Para falar de Maria e João juntos, usamos...","They","We|He|She","They = eles/elas","Mais de uma pessoa (que não inclui quem fala): they."],

<script>
/* ============ ESTADO ============ */
const $=s=>document.querySelector(s);
const app=$('#app'),KEY='erick_quest_v2';
const AX=Object.keys(EIXOS);
const cnt={};
const QS=RAW.map(r=>{
 cnt[r[0]]=(cnt[r[0]]||0)+1;
 /* aceita erradas separadas por "|" OU como itens soltos antes da palavra-chave */
 const wr=r.slice(3,r.length-2).join('|').split('|');
 return{id:r[0]+'-'+cnt[r[0]],e:r[0],q:r[1],c:r[2],w:wr,k:r[r.length-2],x:r[r.length-1]};
});
const byId=Object.fromEntries(QS.map(q=>[q.id,q]));
const HAIRS=['#2b1b10','#7a4a21','#f4c542','#ff4d6d','#19e3ff','#9b5cff'];
const TUNICS=['#7c5cff','#ff4d6d','#19c37d','#ff8a3d','#19a7ff','#ff3d9a'];
const TABS=[['hero','🧙','Herói'],['missoes','⚔️','Missões'],['prova','🔥','Prova'],['grim','📖','Grimório']];
const PRAISE=['Mandou bem! 🔥','Booom! 💥','Gênio! 🧠','Arrasou, Erick! 🚀','Perfeito! ⭐','Que máquina! 😎'];
function def(){return{xp:0,pts:Object.fromEntries(AX.map(k=>[k,0])),seen:{},wrong:[],found:[],hair:HAIRS[0],tunic:TUNICS[0],best:0,ok:0,tot:0,mute:false,sims:0,pw:3,days:0,last:''}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){const d=def();return Object.assign(d,s,{pts:Object.assign(d.pts,s.pts||{})})}}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),G=null,TAB='hero',chestOpen=true;
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1;
const attrLvl=p=>Math.floor(p/5)+1;
const titulo=l=>l>=12?'Lenda das Letras':l>=9?'Herói do Saber':l>=7?'Mago das Palavras':l>=5?'Guerreiro':l>=3?'Escudeiro':'Aprendiz';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const prio=q=>(S.seen[q.id]||0)-(S.wrong.includes(q.id)?.5:0);
const pickQ=(pool,n)=>shuffle(pool).sort((a,b)=>prio(a)-prio(b)).slice(0,n);
const domain=k=>{const l=QS.filter(q=>q.e===k);return l.length?l.filter(q=>S.found.includes(q.id)).length/l.length:0};
const vibe=p=>{try{navigator.vibrate&&!S.mute&&navigator.vibrate(p)}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function daily(){
 const t=new Date(),td=ymd(t);if(S.last===td)return;
 const y=new Date(t);y.setDate(t.getDate()-1);
 S.days=S.last===ymd(y)?S.days+1:1;S.last=td;S.xp+=20;S.pw++;save();
 setTimeout(()=>toast(`🔥 ${S.days}º dia seguido! +20 XP e +1 🪄`),700);
}

/* ============ EFEITOS ============ */
let AC;
function tone(f,d=.12,type='sine',v=.15,when=0){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const sfxOk=()=>{tone(523,.12);tone(659,.12,'sine',.15,.08);tone(784,.2,'sine',.16,.16)};
const sfxBad=()=>{tone(200,.25,'sawtooth',.08);tone(150,.3,'sawtooth',.08,.12)};
const sfxLvl=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.16,i*.1));
function confetti(x,y,n=30){const cols=['#ff3d9a','#19e3ff','#ffd43b','#38f27c','#ff8a3d','#9b5cff'];for(let i=0;i<n;i++){const p=document.createElement('i');p.className='cf';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cols[i%6];p.style.setProperty('--dx',(Math.random()*2-1)*170+'px');p.style.setProperty('--dy',(-Math.random()*220-40)+'px');p.style.setProperty('--r',(Math.random()*900)+'deg');document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}}
function floatText(t,x,y,c){const e=document.createElement('div');e.className='ft';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';e.style.color=c||'#ffd43b';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function flash(c){const e=document.createElement('div');e.className='flash';e.style.background=c;document.body.appendChild(e);setTimeout(()=>e.remove(),450)}
function toast(t){const e=document.createElement('div');e.className='toast';e.innerHTML=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function modal(html,cb){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox">${html}<br><button class="btn full" style="margin-top:12px">Continuar ▶</button></div>`;m.querySelector('button').onclick=()=>{m.remove();cb&&cb()};document.body.appendChild(m);confetti(innerWidth/2,innerHeight/2,60);sfxLvl();vibe([60,40,60])}

/* ============ AVATAR ============ */
function hero(size,u){
 u=u||'x';const L=lvl(S.xp),a=k=>attrLvl(S.pts[k])>=3,sk='#f5c7a1';
 return `<svg viewBox="0 -20 200 275" ${size?`style="width:${size}px"`:''}>
 <defs><radialGradient id="au${u}"><stop offset="0" stop-color="#ffd43b" stop-opacity=".7"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
 <linearGradient id="bl${u}" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9aa5b8"/></linearGradient></defs>
 ${L>=7?`<circle cx="100" cy="115" r="105" fill="url(#au${u})"/>`:''}
 ${a('carisma')?'<path d="M62 105 Q26 190 52 238 L148 238 Q174 190 138 105Z" fill="#ff3d9a" stroke="#b0126b" stroke-width="3"/>':''}
 <rect x="78" y="170" width="18" height="48" rx="6" fill="#283593"/><rect x="104" y="170" width="18" height="48" rx="6" fill="#283593"/>
 <rect x="72" y="208" width="30" height="22" rx="8" fill="${a('agilidade')?'#ffd43b':'#6d4c2f'}"/><rect x="98" y="208" width="30" height="22" rx="8" fill="${a('agilidade')?'#ffd43b':'#6d4c2f'}"/>
 ${a('agilidade')?'<text x="87" y="226" font-size="16" text-anchor="middle">⚡</text><text x="113" y="226" font-size="16" text-anchor="middle">⚡</text>':''}
 <rect x="44" y="108" width="20" height="52" rx="10" fill="${S.tunic}"/><rect x="136" y="108" width="20" height="52" rx="10" fill="${S.tunic}"/>
 <circle cx="54" cy="164" r="9" fill="${sk}"/><circle cx="146" cy="164" r="9" fill="${sk}"/>
 <rect x="62" y="100" width="76" height="80" rx="20" fill="${S.tunic}"/><rect x="62" y="152" width="76" height="9" fill="#ffd43b"/><rect x="94" y="150" width="12" height="13" rx="3" fill="#ff8a3d"/>
 ${a('sorte')?'<text x="100" y="140" font-size="24" text-anchor="middle">🍀</text>':''}
 ${a('forca')?`<g transform="rotate(25 148 168)"><rect x="143" y="88" width="10" height="78" rx="3" fill="url(#bl${u})" stroke="#6b7280"/><polygon points="143,88 148,74 153,88" fill="#e5e7eb"/><rect x="134" y="164" width="28" height="7" rx="3" fill="#ffd43b"/><rect x="144" y="170" width="8" height="16" rx="3" fill="#7a4a21"/></g>`:''}
 ${a('coragem')?'<path d="M10 118 H54 V150 Q54 178 32 190 Q10 178 10 150Z" fill="#19e3ff" stroke="#fff" stroke-width="3"/><text x="32" y="162" font-size="22" text-anchor="middle">⭐</text>':''}
 <circle cx="100" cy="72" r="38" fill="${sk}"/>
 <path d="M61 72 Q58 28 100 28 Q142 28 139 72 Q126 48 100 52 Q74 48 61 72Z" fill="${S.hair}"/><path d="M84 36 L92 22 L100 38 L108 22 L116 36Z" fill="${S.hair}"/>
 <circle cx="87" cy="78" r="5.5" fill="#1b1b2f"/><circle cx="113" cy="78" r="5.5" fill="#1b1b2f"/><circle cx="89" cy="76" r="2" fill="#fff"/><circle cx="115" cy="76" r="2" fill="#fff"/>
 <circle cx="76" cy="90" r="6" fill="#ff8aa0" opacity=".6"/><circle cx="124" cy="90" r="6" fill="#ff8aa0" opacity=".6"/>
 <path d="M88 92 Q100 105 112 92" stroke="#7a2a2a" stroke-width="3.5" fill="#fff" stroke-linecap="round"/>
 ${a('inteligencia')?'<circle cx="87" cy="78" r="12" fill="#19e3ff22" stroke="#19e3ff" stroke-width="3"/><circle cx="113" cy="78" r="12" fill="#19e3ff22" stroke="#19e3ff" stroke-width="3"/><line x1="99" y1="78" x2="101" y2="78" stroke="#19e3ff" stroke-width="3"/>':''}
 ${a('magia')?'<path d="M56 46 L100 -14 L144 46Z" fill="#7b2cff" stroke="#4c1d95" stroke-width="3"/><ellipse cx="100" cy="46" rx="52" ry="9" fill="#5a1fd1"/><text x="100" y="30" font-size="20" text-anchor="middle">⭐</text>':(L>=12?'<text x="100" y="30" font-size="34" text-anchor="middle">👑</text>':'')}
 ${a('criatividade')?'<text x="172" y="50" font-size="28" text-anchor="middle">🎨</text>':''}
 ${a('precisao')?'<text x="28" y="50" font-size="28" text-anchor="middle">🎯</text>':''}
 </svg>`}

/* ============ ABAS ============ */
function shell(inner){
 document.body.classList.remove('playing');
 app.innerHTML=`<header><div class="logo">ERICK QUEST</div><div class="pills"><span class="pill">⭐ Nv ${lvl(S.xp)}</span><span class="pill">🔥 ${S.days||1}</span><span class="pill">🪄 ${S.pw}</span><button class="ghost" onclick="toggleMute()">${S.mute?'🔇':'🔊'}</button></div></header>
 <main>${inner}</main>
 <nav class="tabs"><div class="in">${TABS.map(t=>`<button class="${t[0]===TAB?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
}
function render(){shell({hero:viewHero,missoes:viewMissoes,prova:viewProva,grim:viewGrim}[TAB]())}
function go(t){TAB=t;G=null;render();window.scrollTo(0,0)}
function toggleMute(){S.mute=!S.mute;save();render()}
function setHair(c){S.hair=c;save();render()}
function setTunic(c){S.tunic=c;save();render()}
function resetAll(){if(confirm('Apagar TODO o progresso do Erick?')){S=def();save();daily();render()}}

function viewHero(){
 const L=lvl(S.xp),b=40*(L-1)**2,n=40*L*L,pc=Math.round((S.xp-b)/(n-b)*100);
 const weak=AX.slice().sort((x,y)=>domain(x)-domain(y))[0],we=EIXOS[weak];
 const msg=S.tot===0?'Bora começar, Erick! Toque em Missões e escolha um eixo ⚔️':`Foque em ${we.nome} (${we.tema}): seu domínio está em ${Math.round(domain(weak)*100)}%.`;
 const gears=AX.map(k=>{const e=EIXOS[k],a=attrLvl(S.pts[k]),on=a>=3;return `<div class="gi ${on?'on':''}" style="--c:${e.cor}"><span>${e.gi}</span><b>${e.gear}</b><small>${on?'✔ equipado':e.nome+' Nv '+a+'/3'}</small></div>`}).join('');
 const sw=(arr,cur,fn)=>arr.map(c=>`<button class="sw ${c===cur?'sel':''}" style="background:${c}" aria-label="cor" onclick="${fn}('${c}')"></button>`).join('');
 return `<section class="card herocard"><div class="bubble">💬 ${msg}</div>${hero(240,'h')}
  <div class="hname">ERICK</div><div class="htitle">${titulo(L)} · Nível ${L}</div>
  <div class="xpbar"><i style="width:${pc}%"></i></div><div class="lbl">${S.xp} XP · faltam ${n-S.xp} para o Nv ${L+1}</div></section>
 <div class="stats3"><div class="stat"><b>${S.ok}</b><small>acertos</small></div><div class="stat"><b>${S.tot?Math.round(S.ok/S.tot*100):0}%</b><small>precisão</small></div><div class="stat"><b>${S.found.length}/${QS.length}</b><small>🔑 palavras</small></div></div>

 <section class="card"><h3>📲 Instalar no celular</h3><div class="lbl" style="font-size:14px;margin:0">No navegador, abra o menu e toque em <b>“Adicionar à tela inicial”</b>. O jogo abre em tela cheia e funciona sem internet.</div></section>
 <div style="text-align:center;margin-top:6px"><button class="ghost" style="font-size:13px;padding:0 14px" onclick="resetAll()">♻️ Reiniciar jogo</button></div>`;
}
function viewMissoes(){
 const card=k=>{const e=EIXOS[k],p=S.pts[k],a=attrLvl(p),r=p%5;return `<button class="mis" style="--c:${e.cor}" onclick="startMission('${k}')"><span class="axi">${e.icone}</span><div class="mi"><b>${e.nome}</b><span class="t">${e.tema}</span><div class="bar" style="--c:${e.cor}"><i style="width:${r*20}%"></i></div><small>faltam ${5-r} acertos p/ Nv ${a+1} · domínio ${Math.round(domain(k)*100)}%</small></div><span class="lv">Nv ${a}</span></button>`};
 return `<div class="sec">📚 Português</div>${AX.filter(k=>EIXOS[k].mat==='pt').map(card).join('')}
 <div class="sec">🌎 English</div>${AX.filter(k=>EIXOS[k].mat==='en').map(card).join('')}
 <div class="lbl" style="text-align:center;margin-top:6px">Cada missão tem 5 questões. A cada 5 acertos o atributo sobe. Acertos em sequência valem XP x2 e x3!</div>`;
}
function viewProva(){
 const dom=AX.map(k=>{const e=EIXOS[k],d=Math.round(domain(k)*100);return `<div class="dom"><span>${e.icone} ${e.nome}</span><div class="bar" style="--c:${e.cor}"><i style="width:${d}%"></i></div><b>${d}%</b></div>`}).join('');
 return `<button class="mega pink" onclick="startSim()"><span class="big">🔥</span><div>SIMULADO FINAL<small>40 questões de todos os eixos · melhor nota: ${S.best?(S.best/10).toFixed(1):'—'}</small></div></button>
 <button class="mega cyan" onclick="startErrors()"><span class="big">🛠️</span><div>TREINO DE ERROS<small>${S.wrong.length?S.wrong.length+' questões para refazer':'nenhum erro pendente 🎉'}</small></div></button>
 <section class="card"><h3>📊 Domínio por eixo</h3><div class="lbl" style="margin:0 0 6px">% das questões que você já acertou pelo menos uma vez.</div>${dom}</section>`;
}
function viewGrim(){
 const f=S.found.length;
 return `<div class="lbl" style="font-size:15px;margin:0 0 10px">Cada palavra-chave é desbloqueada quando você acerta a questão. <b>${f}/${QS.length}</b> descobertas!</div>`+AX.map(k=>{const e=EIXOS[k],l=QS.filter(q=>q.e===k),o=l.filter(q=>S.found.includes(q.id)).length;
  return `<details class="gr" style="--c:${e.cor}"><summary>${e.icone} ${e.nome}<small>${o}/${l.length} 🔑</small></summary><div class="lbl" style="margin:0 0 4px">${e.tema}</div><ul>${e.resumo.map(r=>`<li>${r}</li>`).join('')}</ul><div class="kws">${l.map(q=>S.found.includes(q.id)?`<span class="kw on">🔑 ${q.k}</span>`:'<span class="kw off">🔒 ???</span>').join('')}</div></details>`}).join('');
}

/* ============ JOGO ============ */
function begin(mode,list,axis){
 if(!list.length)return;
 G={mode,axis,list,i:0,ok:0,streak:0,max:0,xp:0,log:[],pend:[],locked:false};
 try{history.pushState({g:1},'')}catch(e){}
 renderQ();
}
function startMission(k){begin('mission',pickQ(QS.filter(q=>q.e===k),5),k)}
function startSim(){begin('sim',shuffle(AX.flatMap(k=>pickQ(QS.filter(q=>q.e===k),EIXOS[k].mat==='pt'?4:5))))}
function startErrors(){const l=S.wrong.map(i=>byId[i]).filter(Boolean);if(!l.length){toast('Nenhum erro pra treinar. Você está voando! 🚀');return}begin('errors',shuffle(l).slice(0,8))}
function quit(){if(confirm('Sair desta missão? O que já ganhou fica salvo.'))leave()}
function leave(){if(!G)return;G.log.length?finish(true):go(TAB)}
window.addEventListener('popstate',()=>{if(G)leave()});

function renderQ(){
 const q=G.list[G.i],E=EIXOS[q.e];G.opts=shuffle([q.c,...q.w]);G.locked=false;G.pwq=false;
 document.body.classList.add('playing');
 app.innerHTML=`<div class="qtop"><button class="ghost" onclick="quit()">✕</button><div class="pbar"><i style="width:${G.i/G.list.length*100}%"></i></div><div class="combo ${G.streak>=3?'hot':''}" id="combo">🔥 ${G.streak}</div></div>
 <div class="qmeta"><span class="chip" style="--c:${E.cor}">${E.icone} ${E.nome}</span><button class="pw" id="pw" onclick="usePw()" ${G.opts.length<4||S.pw<1?'disabled':''}>🪄 50/50 · ${S.pw}</button></div>
 <div class="qcard" style="--c:${E.cor}"><div class="qn">Questão ${G.i+1} de ${G.list.length} · ${E.tema}</div><h2>${q.q}</h2>
 <div class="opts">${G.opts.map((o,i)=>`<button class="opt o${i}" data-i="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div></div><div id="sp"></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 window.scrollTo(0,0);
}
function usePw(){
 if(!G||G.locked||G.pwq)return;
 if(S.pw<1){toast('Sem power-ups! Ganhe subindo de nível 🪄');return}
 if(G.opts.length<4){toast('Só tem 2 opções aqui!');return}
 const q=G.list[G.i],btns=[...app.querySelectorAll('.opt')];
 const wrongs=btns.filter((b,i)=>G.opts[i]!==q.c);
 shuffle(wrongs).slice(0,2).forEach(b=>{b.classList.add('gone');b.disabled=true});
 G.pwq=true;S.pw--;save();const p=$('#pw');p.disabled=true;p.textContent='🪄 50/50 · '+S.pw;vibe(20);tone(880,.1,'triangle',.12);
}
function answer(i){
 if(!G||G.locked)return;G.locked=true;
 const q=G.list[G.i],ok=G.opts[i]===q.c,btns=[...app.querySelectorAll('.opt')];
 const rc=btns[i].getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2;
 S.seen[q.id]=(S.seen[q.id]||0)+1;S.tot++;btns.forEach(b=>b.disabled=true);
 const pw=$('#pw');if(pw)pw.disabled=true;
 let head;
 if(ok){
  const L0=lvl(S.xp),p0=S.pts[q.e];G.streak++;G.max=Math.max(G.max,G.streak);G.ok++;
  const m=G.streak>=6?3:G.streak>=3?2:1,g=10*m;S.xp+=g;G.xp+=g;S.pts[q.e]++;S.ok++;
  if(!S.found.includes(q.id))S.found.push(q.id);
  S.wrong=S.wrong.filter(x=>x!==q.id);
  btns[i].classList.add('right');btns.forEach((b,j)=>{if(j!==i)b.classList.add('dim')});
  confetti(cx,cy,22+G.streak*3);floatText('+'+g+' XP'+(m>1?' x'+m:''),cx,cy,'#ffd43b');flash('#38f27c');sfxOk();vibe(30);
  const a0=attrLvl(p0),a1=attrLvl(S.pts[q.e]);
  if(a1>a0){S.pw++;toast(`${EIXOS[q.e].icone} ${EIXOS[q.e].nome} subiu para Nv ${a1}! +1 🪄`);if(a1===3)setTimeout(()=>toast(`🎁 Equipamento: ${EIXOS[q.e].gear} ${EIXOS[q.e].gi}`),900)}
  const L1=lvl(S.xp);
  if(L1>L0){S.pw++;G.pend.push(`<h2>LEVEL UP!</h2>${hero(150,'m'+L1)}<div style="font-size:24px;font-weight:800">Erick agora é nível ${L1}</div><div style="color:#ffd43b;font-size:20px">${titulo(L1)} · +1 🪄</div>`)}
  head=PRAISE[Math.random()*PRAISE.length|0]+(m>1?` Combo x${m}!`:'');
 }else{
  G.streak=0;btns[i].classList.add('wrong');btns[G.opts.indexOf(q.c)].classList.add('right');sfxBad();vibe([80,50,80]);flash('#ff5d5d');
  if(!S.wrong.includes(q.id))S.wrong.push(q.id);head='Quase! Anote a dica 💡';
 }
 G.log.push({e:q.e,ok});save();
 const cb=$('#combo');cb.textContent='🔥 '+G.streak;cb.classList.toggle('hot',G.streak>=3);
 const last=G.i===G.list.length-1;
 app.insertAdjacentHTML('beforeend',`<div class="sheet ${ok?'good':'bad'}" id="sheet"><div class="fbh">${head}</div><div class="key">🔑 ${q.k}</div><p>${q.x}</p><button class="btn full" id="next">${last?'Ver resultado 🏁':'Próxima ▶'}</button></div>`);
 const sh=$('#sheet');$('#sp').style.height=sh.offsetHeight+20+'px';
 $('#next').onclick=nextQ;
 const cr=btns[G.opts.indexOf(q.c)].getBoundingClientRect(),lim=innerHeight-sh.offsetHeight-10;
 if(cr.bottom>lim)window.scrollBy({top:cr.bottom-lim+10,behavior:'smooth'});
}
function nextQ(){
 if(!G)return;
 if(G.pend.length){modal(G.pend.shift(),nextQ);return}
 G.i++;G.i>=G.list.length?finish():renderQ();
}

function finish(early){
 const g=G;if(!g)return go(TAB);
 const n=g.log.length;if(!n){G=null;return go(TAB)}
 const pct=Math.round(g.ok/n*100);let bonus=0;
 if(!early){if(g.mode==='sim'&&pct>=70)bonus=50;else if(g.ok===n&&n>=5)bonus=30}
 S.xp+=bonus;
 if(g.mode==='sim'&&!early){S.sims++;S.best=Math.max(S.best,pct)}
 save();G=null;chestOpen=!(!early&&pct>=80);
 document.body.classList.add('playing');
 const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
 const nome=g.mode==='sim'?'Simulado Final':g.mode==='errors'?'Treino de Erros':EIXOS[g.axis].icone+' '+EIXOS[g.axis].nome;
 let rows='';
 if(g.mode!=='mission'){rows='<div class="card rows">'+AX.map(k=>{const l=g.log.filter(x=>x.e===k);if(!l.length)return'';const o=l.filter(x=>x.ok).length;return `<div class="dom"><span>${EIXOS[k].icone} ${EIXOS[k].nome}</span><div class="bar" style="--c:${EIXOS[k].cor}"><i style="width:${o/l.length*100}%"></i></div><b>${o}/${l.length}</b></div>`}).join('')+'</div>'}
 let dica='';
 if(g.mode==='sim'&&!early){const fr=AX.filter(k=>{const l=g.log.filter(x=>x.e===k);return l.length&&l.filter(x=>x.ok).length/l.length<.6});dica=fr.length?`<div class="card" style="text-align:left">📌 <b>Treine mais:</b> ${fr.map(k=>EIXOS[k].nome+' ('+EIXOS[k].tema+')').join(', ')}</div>`:'<div class="card">🔥 Nenhum ponto fraco! Você está pronto pra prova!</div>'}
 const msg=early?'Missão interrompida. O que acertou foi salvo ✅':pct===100?'PERFEITO! Que lenda! 👑':pct>=70?'Muito bem, Erick! 🚀':pct>=40?'Boa! Continue treinando 💪':'Bora de novo, você consegue! 🔄';
 const again=g.mode==='sim'?'startSim()':g.mode==='errors'?'startErrors()':`startMission('${g.axis}')`;
 app.innerHTML=`<div class="res"><h2>${nome}</h2><div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.25}s">${i<stars?'⭐':'☆'}</span>`).join('')}</div>
 <div class="nota" id="nota">0.0</div><div class="lbl">${g.ok} de ${n} acertos · melhor combo 🔥 ${g.max}</div>
 <h3 style="margin:8px 0 2px">${msg}</h3><div style="font-weight:800;color:var(--yel)">+${g.xp+bonus} XP${bonus?` (bônus ${bonus}!)`:''}</div>
 ${rows}${dica}
 ${chestOpen?'':'<button class="chest" id="chest" onclick="openChest()"><span>🎁</span>Toque para abrir o baú!</button>'}
 <div class="stack"><button class="btn pink full" onclick="${again}">🔁 Jogar de novo</button><button class="btn full" onclick="go(TAB)">🏠 Voltar</button></div></div>`;
 const target=g.ok/n*10,t0=performance.now();
 (function tick(t){const p=Math.min(1,(t-t0)/900),el=$('#nota');if(!el)return;el.textContent=(target*p).toFixed(1);if(p<1)requestAnimationFrame(tick)})(t0);
 if(!early&&stars>=2)setTimeout(()=>{confetti(innerWidth/2,innerHeight/3,80);sfxLvl();vibe([40,30,40])},400);
 window.scrollTo(0,0);
}
function openChest(){
 if(chestOpen)return;chestOpen=true;
 const el=$('#chest');let txt;
 if(Math.random()<.6){S.pw++;txt='🪄 +1 power-up 50/50!'}else{const L0=lvl(S.xp);S.xp+=25;txt='⭐ +25 XP!';if(lvl(S.xp)>L0){S.pw++;setTimeout(()=>modal(`<h2>LEVEL UP!</h2>${hero(150,'c')}<div style="font-size:24px;font-weight:800">Erick agora é nível ${lvl(S.xp)}</div><div style="color:#ffd43b">${titulo(lvl(S.xp))} · +1 🪄</div>`),700)}}
 save();el.style.animation='none';el.innerHTML=`<span>🎉</span>${txt}`;
 const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,50);sfxLvl();vibe(50);
}

/* teclado (desktop) */
document.addEventListener('keydown',e=>{
 if(!G||document.querySelector('.modal'))return;
 const k=e.key.toLowerCase(),i='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):['1','2','3','4'].indexOf(k);
 if(!G.locked&&i>=0){const b=app.querySelectorAll('.opt')[i];if(b&&!b.disabled)b.click()}
 else if(G.locked&&(e.key==='Enter'||e.key===' ')){const b=$('#next');if(b){e.preventDefault();b.click()}}
});

daily();render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
